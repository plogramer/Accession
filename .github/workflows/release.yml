name: Release

# Builds the Windows installer (Accession-<version>-x64.msi).
# - A pushed tag like v0.2 builds it and publishes a GitHub release with the MSI to download
#   (the release notes are that version's section of the README's version history).
# - A push to dev whose commit message contains [release] does the same: the release creates the tag v<x.y.z>
#   (the version in Directory.Build.props) on that commit; if that release exists, its notes and MSI are updated.
# - Any other push to dev that changes the installer only builds it (download it from the run's artifacts).
on:
  push:
    tags: ['v*']
    branches: [dev]
    paths: ['installer/**', '.github/workflows/release.yml', 'Directory.Build.props', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  msi:
    name: Build installer (windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # v0.2 -> 0.2.0 (an MSI needs three numbers); without a tag, the version in Directory.Build.props.
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v', 'V') }
          else { $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version }
          $parts = @($v.Split('-')[0].Split('+')[0].Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = ($parts[0..2] -join '.')
          # Shown as the app shows it: 0.1.0 -> 0.1, 0.2.3 -> 0.2.3 (and the README's version history uses that).
          $display = if ($parts[2] -eq '0') { ($parts[0..1] -join '.') } else { $version }
          "version=$version" >> $env:GITHUB_OUTPUT
          "display=$display" >> $env:GITHUB_OUTPUT
          # Publish for a tag, or for a dev commit that asks for it (the tag is then created with the release).
          $release = $env:GITHUB_REF_TYPE -eq 'tag' -or "$env:COMMIT_MESSAGE".Contains('[release]')
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (shown as $display); release: $release ($tag)"

      - name: Publish the app (self-contained, win-x64)
        run: dotnet publish src/Accession.App/Accession.App.csproj -p:PublishProfile=win-x64 -p:Version=${{ steps.version.outputs.version }}

      - name: Build the MSI
        run: dotnet build installer/Accession.Installer.wixproj -c Release -p:ProductVersion=${{ steps.version.outputs.version }}

      - name: Upload the MSI
        uses: actions/upload-artifact@v4
        with:
          name: Accession-${{ steps.version.outputs.version }}-x64
          path: artifacts/installer/*.msi
          if-no-files-found: error

      - name: Publish the GitHub release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $display = '${{ steps.version.outputs.display }}'
          $msi = 'artifacts/installer/Accession-${{ steps.version.outputs.version }}-x64.msi'

          # This version's section of the README's version history ("### 0.2 – 2026-10-15" up to the next heading).
          $lines = Get-Content README.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match "^### $([regex]::Escape($display))( |$)" })
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^#{2,3} '; $i++) { $notes += $lines[$i] }
          }
          $body = @(
            "## Download"
            ""
            "Download **Accession-${{ steps.version.outputs.version }}-x64.msi** below and run it. Windows 10 (1809) or 11, 64-bit; nothing else to install."
            "Windows may warn that the installer is from an unknown publisher (it is not code-signed): choose *More info* → *Run anyway*."
            ""
            "## What's new"
          ) + $notes
          $body -join "`n" | Out-File notes.md -Encoding utf8

          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Released already (e.g. fixing its notes): update the title, notes and installer.
            gh release edit $tag --title "Accession $display" --notes-file notes.md
            gh release upload $tag $msi --clobber
          }
          else {
            # For a pushed tag the tag exists; otherwise the release creates it on this commit.
            gh release create $tag $msi --title "Accession $display" --notes-file notes.md --target $env:GITHUB_SHA
          }
